application:
  name: warehouse

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/smarthome?currentSchema=warehouse
    username: "dbuser"
    password: "12345"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: warehouse
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8085
  #port: 0