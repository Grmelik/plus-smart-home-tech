spring:
  application:
    name: shopping-store

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/smarthome?currentSchema=store
    username: "dbuser"
    password: "12345"
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: store
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 0