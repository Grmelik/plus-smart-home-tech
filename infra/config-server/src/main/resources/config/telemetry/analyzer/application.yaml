application:
  name: analyzer

kafka:
  bootstrap-server: localhost:9092
  group-id:
    snapshot: analyzer.snapshots
    hub: analyzer.hubs
  topics:
    snapshot: telemetry.snapshots.v1
    hub: telemetry.hubs.v1

grpc:
  client:
    hub-router:
      address: 'static://0.0.0.0:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
      enableRetry: true
      maxRetryAttempts: 3

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/analyzer?currentSchema=public
    username: "dbuser"
    password: "12345"
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show-sql: true

  sql:
    init:
      mode: always

logging:
  level:
    ru.yandex.practicum: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    root: INFO