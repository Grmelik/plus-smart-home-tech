application:
  name: collector

grpc:
  server:
    port: 59091
    enable-reflection: true

kafka:
  bootstrap-server: localhost:9092
  topics:
    sensors: telemetry.sensors.v1
    hubs: telemetry.hubs.v1
  health-check:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always